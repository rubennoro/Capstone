    The right side (tag 1) is at +y.
  K: 'carrier frame of one finger: origin = midpoint of the two M4 hole centres on the tongue inner face; x = hand +x (camera
    side), y = outward (away from the other finger), z = hand +z. Left K is mirrored.'
  K_in_hand: 'right: (x, +(12.5 + g/2 + y), 70.3 + z); left: (x, -(12.5 + g/2 + y), 70.3 + z), g = gap'
