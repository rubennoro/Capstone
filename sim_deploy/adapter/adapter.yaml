  assumed: ['Hand frame origin at the flange with the hand base face on it (menagerie: hand body at link7 z 0.107 = flange,
      -45 deg); the menagerie hand geometry is Franka''s CAD', 'tongue inner faces 25.0 apart at the closed stop = gap 0 (stock
      fingertips touch there, so libfranka width = our fingertip gap)', housing top 65.9 (menagerie) + 11.40 (manual) = tongue
      top 77.3; holes 7.0 below (manual 15 - 8)]
