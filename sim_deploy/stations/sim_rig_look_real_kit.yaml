# sim_deploy station 'sim_rig_look_real_kit' (W2 look 'real_kit'): GENERATED by `python -m sim_deploy.look.make_stations` from
# stations/sim_rig.yaml (do not edit by hand; rerun it after sim_rig.yaml changes). Physics as sim_rig
# (eraser 127 x 30 x 12 mm: every station's width, sim_deploy/eraser.py); the look stations are for
# images only (render_sets / robot_trials), not for the closed loop. Only the look
# differs, to make the sim camera images close to the real Pi frames (W2, PLAN.md section 11):
#  - table: the real light wood photographed by the IMX519 (look/assets/table_real.png, 0.50 x 0.20 m per tile,
#    at its real place in O via layout.json T_O_tag), matte, on a visual-only slab; box sides = its mean colour
#  - eraser rgba = the real lime top face as the IMX519 records it [159.0, 214.0, 138.0] / 255 / 1.000 (the light
#    on a horizontal face), so the render reproduces it
#  - soft diffuse light (the real frames show only faint soft shadows): headlight ambient 0.75 + one
#    directional light from nearly straight above, diffuse 0.25, no shadows, no specular; sim_pi shadows off
#  - skybox and floor neutral grey
#  - kit colours of the HANDHELD in training: fin-ray pads [0.528, 0.788, 0.977] (light blue), holders
#    [0.142, 0.403, 0.705] (blue); sampled in B1's IMX519 640 frames under the sim's pad / holder
#    labels (median), scaled by real / sim-render per channel (the robot's printed pads are white)
# The rest of this file is sim_rig.yaml's text (its comments describe sim_rig's look where they talk about it).
# sim_deploy station "sim_rig": what `python -m sim_deploy.model build --station sim_deploy/stations/sim_rig.yaml`
# turns into sim_deploy/build/sim_rig/{scene.xml, meshes/, model.json} (DESIGN.md section 2, "E6: as built").
# Paths are relative to this file. Positions are in metres in the robot base frame O (libfranka's O), angles in degrees.
schema: sim_deploy.station/v1
id: sim_rig_look_real_kit

# Panda + Franka Hand + finger kit: franka_sim's MjSpec builder (controlSW/franka_sim/franka_sim/model.py) on its
# station configs (controlSW/configs/station/<group>/<id>.yaml, run/<group>/<id>.yaml), with these overrides.
# The kit path is relative to controlSW/ (franka_sim's convention, model.resolve_kit).
franka_sim:
  station: {robot: panda, tooling: franka_hand_iphumi_rig1, sensor: rig1_wifi, scene: pick_place_table}
  run: {sim: physics}                       # timestep 1 ms (the sim PC steps 1 ms per control cycle), implicitfast
  set:
    - tooling.finger_adapter.mode=kit
    - tooling.finger_adapter.kit=../sim_deploy/adapter/kit_franka_v1
    - tooling.finger_adapter.kit_sha256=88fc545321953122d28a639a673d634dc513849b5a01dc79fc8423940d2ce188   # adapter.yaml sim_kit (E7: real tag positions)
    - tooling.finger_adapter.adapter_length_m=0.0
    - tooling.finger_adapter.lateral_offset_m=0.0
    - tooling.finger_adapter.adapter_yaw_deg=0.0
    - tooling.tcp_x_along_hand="+y"          # camera on the hand's +x face (E2, contracts/frames.yaml)

rig_dir: ../rig                             # E2: add_rig(spec, "hand", rig_dir)
contracts_dir: ../../deployment/contracts   # frames.yaml F_T_TCP -> site tcp (read at build time, D7)
control_config: ../../deployment/control_deploy/franka_control/config.yaml   # homing.q_home_rad -> key "home"
rig_file: ../../deployment/contracts/rigs/rig_pi_v3_640.yaml   # camera intrinsics for the model's pinholes (below)

cameras:                                    # pinhole intrinsics stored in the model (renderers may override them)
  cam_imx519: {from: cameras.main}          # nominal 492.5 @ 640x480 (its tiny radtan is E5's job)
  cam_imx219: {from: virtual_ultrawide}     # the policy's virtual pinhole; the fisheye itself is rendered by E5

# W0 (2026-11-20): the printed fingers open 0..40 mm at the fingertips (upstream f632576 measured it on the robot:
# contracts/limits.yaml gripper_width_max_m 0.04, width_offset_m 0: the hand reads the fingertip gap). Each finger
# joint is limited to 0..0.020 (menagerie 0..0.040); the geometry at a given gap is unchanged (tips touch at q = 0).
finger_max_gap_m: 0.040                     # fingertip gap at the hand's open stop (= finger_joint1 + finger_joint2)
hand_home_gap_m: 0.040                      # finger gap in the home key (the hand homes fully open)
offscreen_px: [1600, 1600]                  # offscreen framebuffer (cube-map faces for the fisheye need > 640)

# E7: what the real gripper looks like (visual only): white fin-ray fingers, blue UMI holders, the real ArUco stickers
# (DICT_4X4_50 16 mm marker on a 20 mm white sticker, ids from the kit), a light wood table.
appearance:
  pads_rgba: [0.528, 0.788, 0.977, 1.0]   # W2 real_kit: training's light-blue pads
  holders_rgba: [0.142, 0.403, 0.705, 1.0]   # W2 real_kit: training's blue holders
  adapters_rgba: [0.25, 0.25, 0.27, 1.0]
  aruco_tags: true
  table_texture: file                       # W2: the real table (make_assets table)
  table_texture_file: ../look/assets/table_real.png
  table_texture_size_m: [0.5, 0.2]
  table_texture_origin_O_m: [0.23, -0.03]   # O (x, y) of the image's bottom-left corner
  table_specular: 0.0
  table_shininess: 0.0
  table_rgba: [0.605, 0.6071, 0.588, 1.0]   # the box's sides: the tile's mean colour

# E7: the fin-ray compliance (DESIGN.md "E7: integration"; numbers below are E7's, with the 51 mm eraser and the
# 0.08 stroke; W0's 30 mm eraser: scene/README.md "Grasp feasibility"). The real fingers hold the 51 mm eraser with
# the fingertip gap at 52-56 mm (training's hold widths; D8: width = gap): the soft fingers wrap it. Here the
# pad-eraser contacts are explicit pairs whose margin is a soft layer: each pad starts pushing 3.5 mm before its
# rigid surface touches (contact from a 58 mm gap on), a direct spring-damper (solref < 0: stiffness, damping;
# with the eraser's mass about 2.9 N per mm per pad), constant impedance 0.99, stiff friction (no creep). With the
# sim PC's stiff finger servo (control_sim.yaml sim.gripper.kp_n_per_m 20000) a commanded 0.052 / 0.054 / 0.056
# holds at a gap of 52.8 / 54.5 / 56.3 mm with 7.5 / 5.0 / 2.5 N per pad (the eraser weighs 0.29 N); a 20 N grasp
# is reached at about 0.047.
finger_contact:
  margin_m: 0.0035
  solref: [-200.0, -28.0]
  solimp: [0.99, 0.99, 0.001, 0.5, 2.0]
  solreffriction: [0.002, 1.0]
  friction: [1.0, 1.0, 0.01, 0.0001, 0.0001]
  condim: 4

scene:
  # P3/P4 (2026-11-20, the user): the robot base is mounted directly on the table: the table top IS the base's
  # mounting plane, O z = 0, flat and level all around the base (no pedestal, no near edge). link0 (and link1) are
  # excluded from table contact (link0 sits on it); every other link, the hand, rig and fingers collide with it.
  # The sim PC's box floor is table - 5 mm (control_sim*.yaml workspace_min_m z -0.005, as E7's 0.045 was for the old
  # table at 0.05). Was: a pedestal top at z 0 and the table top 50 mm higher, x 0.16-0.96, y +-0.50.
  table:
    top_z_m: 0.0
    x_m: [-0.40, 1.00]                      # around the base: 40 cm behind its axis to 1 m ahead
    y_m: [-0.80, 0.80]
    floor_z_m: -0.70
    friction: [0.8, 0.005, 0.0001]
    rgba: [0.66, 0.65, 0.62, 1.0]
  floor_rgba: [0.45, 0.45, 0.45, 1.0]
  skybox: {rgb_top: [0.72, 0.72, 0.72], rgb_bottom: [0.50, 0.50, 0.50]}   # W2: neutral grey
  eraser:
    size_m: [0.127, 0.030, 0.012]           # image look, the real length; width = sim_deploy/eraser.py WIDTH_M (30 mm, every station)
                                            # f632576 policy.yaml gripper_map.robot_closed_m ("the eraser's width:
                                            # the robot holding it reads this"), so upstream's 0.040 m stroke can
                                            # straddle it and the mapped close (training 0.051 -> 0.030) is a grasp.
                                            # The user's real eraser is 127 x 51 x ~12 mm (E7): 51 mm never fits in
                                            # 40 mm (scene/README.md "Grasp feasibility"). The width is the same in
                                            # EVERY station, image looks too: sim_deploy/eraser.py WIDTH_M (checked by
                                            # look.make_stations --check)
    resting: flat                           # flat (127 x 51 face down) | on_long_edge (127 x 12 down) | on_end
                                            # (2026-11-20, the user: lies flat, gripped across its width;
                                            # see scene/README.md "Grasp feasibility" for what the data says)
    mass_kg: 0.030                          # about 30 g
    friction: [1.0, 0.01, 0.0001]           # rubber-like; torsional 0.01 m so the soft fingers resist spinning
    condim: 4                               # sliding + torsional (the kit pads are condim 4 too)
    rgba: [0.6238, 0.8396, 0.5414, 1.0]   # W2: the real lime top face (eraser_real.json) / light
    default_pose: {xy_m: [0.30, 0.00], yaw_deg: 0.0}   # centred under the home TCP (0.307, 0.000) by the user's
                                                       # choice (E7), slightly left of the training median y -0.021;
                                                       # length along O x (the fingers close along O y at home)
  external_camera:                          # fixed camera for the episode videos
    pos_m: [1.20, -0.75, 0.80]
    target_m: [0.36, 0.00, 0.24]
    fovy_deg: 50.0
    resolution_px: [640, 480]
  lights:                                   # directional (no spot cone): a key light from above with shadows + a fill
    - {dir: [0.05, 0.03, -1.0], diffuse: [0.25, 0.25, 0.25], specular: [0.0, 0.0, 0.0], castshadow: false}   # W2
  headlight: {ambient: [0.75, 0.75, 0.75], diffuse: [0.0, 0.0, 0.0], specular: [0.0, 0.0, 0.0]}   # W2: soft room light

# W2: no light casts a shadow (soft room light): no shadow pass
sim_pi:
  shadows: false
  camera_look: ../look/camera_look_real.yaml   # W2 step 2: the real cameras' response
