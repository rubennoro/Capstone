# dataproc rig description (schema dataproc.rig.v1) for the Raspberry Pi 5 rig on the handheld UMI gripper, with the
# geometry taken from CAD. `dataproc calibrate --rig rig_pi_v3` copies it to $DATAPROC_ROOT/rigs/rig_pi_v3.yaml if
# missing.
# Conventions and time model: as in rig_v1.yaml (T_a_b maps frame b to frame a, metres, OpenCV optical camera
# frames, gravity-aligned z-up world; t_cam = t_ns + s * (exposure_ns // 2) + time_offset_ns).
# Differences from rig_pi_v2 (cameras, intrinsics, IMU noise, tags, world offset unchanged):
#   - tcp.T_cam_tcp, cameras.main.T_imu_cam and cameras.ultrawide.T_imu_cam come from CAD (2026-11-12): iPhUMI's
#     vis_assembly (the UMI gripper with its soft fingers) plus our top cover (IMX519 on the 30 deg face, IMX219 and
#     the IMU on the 15 deg face). Regenerate or check them with `python scripts/rig_geometry_from_cad.py [--check]`.
#   - gripper.max_opening_m is 0.080 (the Franka Hand's stroke), so every demonstrated width is one the robot can
#     reproduce once the handheld gripper is limited to 80 mm, and gripper.closed_width_m is 0.044 (episode_000056).
#     Both only produce warnings in `dataproc calibrate`: like iPhUMI, only the tag fit itself can fail a calibration.
# Lens optical centres: in line with the lower hole pair of each camera's 21 x 12.5 mm pattern (6.25 mm down the face
# from its centre), boards directly on the 4 mm bosses, optical centre 2.5 mm out from the boss tips (2026-11-13).
# Still nominal (provenance: nominal) until calibrated: the lens height (+-2 mm, along the optical axis), the IMU chip
# position on its board, all intrinsics. Kalibr (camera-IMU) and a TCP check replace them.
schema: dataproc.rig.v1
rig_id: rig_pi_v3
notes: >
  Pi 5 rig on the handheld UMI gripper: IMX519 main (pinhole, 1600x1200 @ 30, on the top cover's 30 deg face),
  IMX219 160 deg fisheye ultrawide (1280x960 @ 30, on the 15 deg face), LSM6DSOX IMU at 104 Hz (on the 15 deg face,
  x down the face, y to the right). TCP and IMU-camera transforms from CAD; everything else nominal until calibrated.
cameras:
  main:
    sensor: imx519
    resolution: [1600, 1200]
    fps: 30
    model:
      type: pinhole-radtan
      intrinsics: [1231.25, 1231.25, 799.5, 599.5]    # nominal ~66 deg HFOV (~78 deg diagonal), centred; not used
      distortion: [-0.02, 0.01, 0.0, 0.0]             # by any processing stage (main images are only letterboxed)
    T_imu_cam:                                        # CAD: IMX519 lens on the 30 deg face, 15 deg steeper than the IMU's face
      matrix: [
        [ 0.000000000,  0.965925826,  0.258819045, -0.040924868],
        [-1.000000000,  0.000000000,  0.000000000, -0.029440000],
        [ 0.000000000, -0.258819045,  0.965925826,  0.009361928],
        [ 0.000000000,  0.000000000,  0.000000000,  1.000000000]]
    timestamp_ref: end_of_exposure                    # Pi 5 SensorTimestamp = start-of-frame interrupt = end of the
    time_offset_ns: 0                                 # first row's exposure (sensor_rig/docs/raspberry_pi.md §5)
    provenance: nominal
  ultrawide:
    sensor: imx219
    resolution: [1280, 960]
    fps: 30
    model:
      type: fisheye-equidistant
      intrinsics: [572.9, 572.9, 639.5, 479.5]        # rig_v1 (820x616) x 1.561 (1640x1232 mode -> 1280x960)
      distortion: [0.02, -0.005, 0.001, 0.0]          # Kannala-Brandt k1..k4 (scale-free), as rig_v1
    T_imu_cam:                                        # CAD: same face as the IMU (axis swap only); lens 29.5 mm along -y,
      matrix: [                                       # 14.6 mm up the face and 6.5 mm in front of the IMU
        [ 0.000000000,  1.000000000,  0.000000000, -0.014637073],
        [-1.000000000,  0.000000000,  0.000000000, -0.029490000],
        [ 0.000000000,  0.000000000,  1.000000000,  0.006500336],
        [ 0.000000000,  0.000000000,  0.000000000,  1.000000000]]
    timestamp_ref: end_of_exposure                    # see main
    time_offset_ns: 0
    provenance: nominal
virtual_ultrawide:                                    # the iPhone 16 Pro ultrawide K at 640x480 (iPhUMI exports)
  resolution: [640, 480]
  intrinsics: [246.64919, 246.64919, 320.16495, 239.53679]
  rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}
tcp:                                                  # T_cam_tcp is in the PHYSICAL ultrawide optical frame
  T_cam_tcp:                                          # CAD: fingertip point 204.9 mm ahead, 54.8 mm below, 8.1 mm right
    matrix: [                                         # of the IMX219 (15 deg about x; iPhUMI's iPhone: (0, 64.4, 211.4))
      [ 1.000000000,  0.000000000,  0.000000000,  0.008130000],
      [ 0.000000000,  0.965925826, -0.258819045,  0.054845479],
      [ 0.000000000,  0.258819045,  0.965925826,  0.204889292],
      [ 0.000000000,  0.000000000,  0.000000000,  1.000000000]]
  provenance: nominal
imu:
  sensor: lsm6dsox
  noise:                                              # datasheet order of magnitude; replace with Allan variance
    gyroscope_noise_density: 6.6e-5
    gyroscope_random_walk: 2.0e-6
    accelerometer_noise_density: 7.0e-4
    accelerometer_random_walk: 1.0e-4
  vio_inflation: {noise_density: 1.0, random_walk: 1.0}
  time_offset_ns: 0                                   # all streams share the Pi clock
  provenance: nominal
aruco:                                                # finger tags (iPhUMI aruco_config.yaml / gripper calibration)
  dict: DICT_4X4_50
  marker_size_m: 0.016
  left_id: 0
  right_id: 1
  nominal_z_m: 0.098                                  # only used to reject far-off tag detections; rough is fine
gripper:                                              # `dataproc calibrate` warns outside these (docs/PROCESS.md)
  max_opening_m: 0.080                                # max_width - min_width of the fit (tag-to-tag x, metres): the
  opening_tolerance_m: 0.010                          # Franka Hand's 80 mm stroke (the handheld must be limited to it)
  closed_width_m: 0.044                               # min_width (tags fully closed), episode_000056; far above it
                                                      # usually means a tag was hidden when the gripper closed
world_offset:                                         # as rig_v1 (see docs/GEOMETRY.md)
  translation_m: [0.1, 0.2, 0.3]
  yaw_deg: 30.0
