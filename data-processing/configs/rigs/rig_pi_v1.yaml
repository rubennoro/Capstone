# dataproc rig description (schema dataproc.rig.v1) for the Raspberry Pi 5 rig as it records today
# (/data/incoming, converted by dataproc/pi_adapter.py; docs/PI_ADAPTER.md). `dataproc run` copies it to
# $DATAPROC_ROOT/rigs/rig_pi_v1.yaml if missing.
# Conventions and time model: as in rig_v1.yaml (T_a_b maps frame b to frame a, metres, OpenCV optical camera
# frames, gravity-aligned z-up world; t_cam = t_ns + s * (exposure_ns // 2) + time_offset_ns).
# Differences from rig_v1: the stream sizes the Pi actually records (main 1600x900 @ 60, ultrawide 1280x960 @ 30),
# so the nominal intrinsics are rig_v1's scaled to those sizes. Everything is nominal until calibrated.
schema: dataproc.rig.v1
rig_id: rig_pi_v1
notes: >
  Pi 5 rig: IMX519 main (pinhole, 1600x900 @ 60 from the 1920x1080 mode), IMX219 160 deg fisheye ultrawide
  (1280x960 @ 30 from the 2x2-binned 1640x1232 mode), LSM6DSOX IMU at 104 Hz. All values nominal until calibration.
cameras:
  main:
    sensor: imx519
    resolution: [1600, 900]
    fps: 60
    model:
      type: pinhole-radtan
      intrinsics: [1231.25, 1231.25, 799.5, 449.5]    # rig_v1 x 1.25 (1280 -> 1600): same ~66 deg HFOV
      distortion: [-0.02, 0.01, 0.0, 0.0]
    T_imu_cam:                                        # nominal, as rig_v1
      rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}
      translation_m: [0.020, 0.0, 0.010]
    timestamp_ref: end_of_exposure                    # Pi 5 SensorTimestamp = start-of-frame interrupt = end of the
    time_offset_ns: 0                                 # first row's exposure (sensor_rig/docs/raspberry_pi.md §5)
    provenance: nominal
  ultrawide:
    sensor: imx219
    resolution: [1280, 960]
    fps: 30
    model:
      type: fisheye-equidistant
      intrinsics: [572.9, 572.9, 639.5, 479.5]        # rig_v1 (820x616) x 1.561 (1640x1232 mode -> 1280x960)
      distortion: [0.02, -0.005, 0.001, 0.0]          # Kannala-Brandt k1..k4 (scale-free), as rig_v1
    T_imu_cam:                                        # nominal, as rig_v1
      rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}
      translation_m: [-0.020, 0.0, 0.010]
    timestamp_ref: end_of_exposure                    # see main
    time_offset_ns: 0
    provenance: nominal
virtual_ultrawide:                                    # the iPhone 16 Pro ultrawide K at 640x480 (iPhUMI exports)
  resolution: [640, 480]
  intrinsics: [246.64919, 246.64919, 320.16495, 239.53679]
  rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}
tcp:                                                  # T_cam_tcp is in the PHYSICAL ultrawide optical frame
  T_cam_tcp:                                          # nominal CAD, as rig_v1
    rotation: {euler_xyz_deg: [15.0, 0.0, 0.0]}
    translation_m: [0.0, 0.060, 0.200]
  provenance: nominal
imu:
  sensor: lsm6dsox
  noise:                                              # datasheet order of magnitude; replace with Allan variance
    gyroscope_noise_density: 6.6e-5
    gyroscope_random_walk: 2.0e-6
    accelerometer_noise_density: 7.0e-4
    accelerometer_random_walk: 1.0e-4
  vio_inflation: {noise_density: 1.0, random_walk: 1.0}
  time_offset_ns: 0                                   # all streams share the Pi clock
  provenance: nominal
aruco:                                                # finger tags (iPhUMI aruco_config.yaml / gripper calibration)
  dict: DICT_4X4_50
  marker_size_m: 0.016
  left_id: 0
  right_id: 1
  nominal_z_m: 0.098
world_offset:                                         # as rig_v1 (see docs/GEOMETRY.md)
  translation_m: [0.1, 0.2, 0.3]
  yaw_deg: 30.0
