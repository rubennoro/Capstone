[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dataproc"
version = "0.1.0"
description = "Jetson-side intake and offline processing of rig episodes into a training .zarr.zip"
requires-python = ">=3.10"
# Pinned to the versions the code and tests were written against (docs/DESIGN.md, "Development environment"; they
# match iPhUMI's environment.yml). Unpinned installs break: numcodecs >= 0.16 drops what zarr 2.18.3 imports,
# OpenCV 5 changes the ArUco API and drops undistortPointsIter, SciPy 1.18 changes Rotation.from_euler shapes.
dependencies = [
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "av==17.1.0",
    "scipy==1.15.3",
    "pyyaml==6.0.3",
    "zarr==2.18.3",
    "imagecodecs==2025.3.30",
    "numcodecs==0.13.1",
    "transforms3d==0.4.2",
    "numba==0.68.1",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
dataproc = "dataproc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataproc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ROS Humble on the laptop puts its pytest plugins on PYTHONPATH; they fail to import (missing lark).
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint -p no:ament_xmllint -p no:ament_pep257"
