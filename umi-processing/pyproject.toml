[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "umiproc"
version = "0.1.0"
description = "UMI's map -> calibrate -> run SLAM pipeline for the Pi 5 rig (IMX219 ultrawide + IMX519 main + LSM6DSOX)"
requires-python = ">=3.10"
# Self-contained: umiproc/dp/ is a copy of data-processing/dataproc (docs/DESIGN.md "The dataproc copy"); nothing here
# imports or reads data-processing/. The pins are the ones the copied code was tested with.
dependencies = [
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "av==17.1.0",
    "scipy==1.15.3",
    "pyyaml==6.0.3",
    "zarr==2.18.3",
    "imagecodecs==2025.3.30",
    "numcodecs==0.13.1",
    "transforms3d==0.4.2",
    "numba==0.68.1",
    "matplotlib==3.9.2",           # map's slam_run.png figures, plot-run
]

[project.optional-dependencies]
test = ["pytest"]
plot = ["matplotlib==3.9.2"]  # kept so `pip install -e umi-processing[plot]` still works

[project.scripts]
umiproc = "umiproc.cli:main"

[tool.setuptools.packages.find]
include = ["umiproc*"]
