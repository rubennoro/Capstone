# franka_deploy launcher config: `python -m franka_deploy run --config deploy.yaml [--mock]`.
# Base = Jetson profile; `profiles.mock` is merged on top with --mock. Paths: absolute (REPLACE on the Jetson).
work_root: &base_work_root /home/jetson/franka_runs           # must be outside the repo (preflight)
python: &base_python
  bp: /home/jetson/envs/bp/bin/python          # inference env (JetPack torch + requirements-inference.txt)
  realenv: /home/jetson/envs/realenv/bin/python
extra_path: []                                # e.g. the dir holding ffmpeg (libx264) for the camera VideoLogger
checkpoint: &base_checkpoint /home/jetson/models/run_001/best_slim.ckpt
prompt_zarr: &base_prompt_zarr /home/jetson/models/run_001/firstreal-single.zarr.zip
prompt_zarr_sha256: null                      # set to pin the prompt dataset (preflight)
disk_budget_gb: &base_disk_budget_gb 5.0
home:                                         # TCP home (base frame): FK must be within max_dist_m at start and at every `c`
  xyz: [0.45, 0.0, 0.25]
  max_dist_m: 0.05
  pose: null                                  # full TCP pose [x,y,z,qw,qx,qy,qz] for `r` (Cartesian homing); HW: measure
task:
  name: block_raise
  prompt_index: 0
  agent_hz: 20
  anchor: target
  pause: true
  exec_h: 8
  inference_timeout_s: 2.0
  width_proprio: commanded
  v_max: 0.25                                 # = bridge safety v_max (0.5 m/s is the reported B5 setting)
  w_max: 1.0
  tap_images_every: 50
camera:
  config: wrist_right                         # real-env configs/peripherals/rig_<config>.yaml
  rig_config_path: /home/jetson/rig/rig_calibrated.yaml
  endpoint: tcp://localhost:16702
  logger_endpoint: tcp://localhost:55556
  video: true                                 # libx264 video of both cameras per episode: robologger fixes 5 Mbit/s per camera
                                              # -> ~70-85 MB per minute of rollout (~4.3 GB per hour); budget disk accordingly
  overrides: []
bridge:
  config: configs/bridge.yaml
  endpoint: tcp://127.0.0.1:5565
  allow_inject: false
  override:
    backend: {type: panda_py}
controller:
  config: configs/franka_cartesian.yaml
  endpoint: tcp://localhost:26010
  override:
    gripper: {type: feetech}
inference: {endpoint: tcp://0.0.0.0:18765, device: cuda, ready_timeout_s: 300}
spacemouse: {endpoint: tcp://localhost:15557, mock: false}
profiles:
  mock: &mock_profile
    camera:
      config: wrist_mock
      rig_config_path: null                   # the replayed episode's rig.yaml
      episode_dir: null                       # REPLACE: a raw (sim) rig episode to replay
      overrides: ["publish_mode=per_main_frame"]
    bridge: {override: {backend: {type: fake}}, allow_inject: true}
    controller: {override: {gripper: {type: fake}}}
    spacemouse: {mock: true}
    home: {xyz: [0.45, -0.0644, 0.1386], max_dist_m: 0.05, pose: [0.45, -0.0644, 0.1386, -0.1306, 0.9914, 0.0, 0.0]}  # FakeBackend flange home composed with F_T_TCP
  # ---------------------------------------------------------------------------------------------- B6 station profiles
  # Wireless sensor path: camera.kind wireless = the B5 receiver (camera.yaml from the station sensor group). In sim
  # profiles a `sender` child imitates the sensor over run.link (run.sim.image_source picks it: render = A7/B8). The home (home.xyz/max_dist_m, and for the sim backends
  # home.pose + the bridge start pose) comes from the station (robot.home_tcp). Paths (work_root, python, checkpoint, prompt_zarr,
  # disk_budget_gb): not set here; load_config fills them from the station host group (pc_laptop), B10. Override with
  # `--set host.work_root=DIR` on run / check-config.
  sim-rig: &sim_base                          # MuJoCo arm + bridge-served Franka Hand + rendered rig images; the policy slot is run.policy
    station: {robot: panda, tooling: franka_hand_iphumi_rig1, sensor: rig1_wifi, scene: block_raise_table, host: pc_laptop}
    run: {policy: fake, link: ideal, criteria: block_raise, sim: render}   # closed loop; pass --policy to swap in another policy
    run_mode: sim
    sim_state_endpoint: tcp://127.0.0.1:5570  # A6's state PUB (the judge and the render sender subscribe)
    station_set: ["sensor.transport.bind_host=127.0.0.1", "tooling.hand.endpoint=tcp://127.0.0.1:5565"]   # hand = bridge
    task: {v_max: null, w_max: null}          # sim: criteria.limits decide; real-* keep the deploy values 0.25 / 1.0 (min rule)
    allow_placeholders: []
    user_site_children: []                    # env_sim has flask itself
    camera: {kind: wireless, config: null, rig_config_path: null, video: false, overrides: []}
    bridge: {override: {backend: {type: mujoco}}, allow_inject: true, allow_sim_reset: true}
    controller: {override: {gripper: {type: franka_hand}}}
    spacemouse: {mock: true}
