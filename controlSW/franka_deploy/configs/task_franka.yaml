# FrankaPromptTask settings for the Franka (franka_deploy/tasks/run_task.py flags)
task_name: block_raise
prompt_index: 0
anchor: target                           # decision (a): target anchor; >2 cm |target-FK| -> measured + reseed; >5 cm -> hold
anchor_fallback_m: 0.02
anchor_hold_m: 0.05
pause: true                              # pause mode (continuous needs capture->reply < ~0.42 s)
exec_h: 8
inference_timeout_s: 2.0
width_proprio: commanded                 # commanded (upstream action_as_proprio) | measured (evaluate in B5; hardware_day 6.5)
state_max_age_s: 0.05
controller_timeout_s: 0.05
endpoints:
  policy: tcp://localhost:18765
  camera: tcp://localhost:16702
  controller: tcp://localhost:26010
  spacemouse: tcp://localhost:15557
