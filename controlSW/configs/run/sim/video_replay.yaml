schema: run.sim/v1
id: video_replay
image_source: video_replay                   # Stage 2b only (teacher-forced) and transport tests
history_source: replay_gt
loop: false
start_delay_s: 2.0
raw_root: data/raw/2026-10-01                # raw iPhone episodes (relative to the repo root, or absolute)
episode_index: 0                             # index into raw_root's sorted *firstreal_demonstration* episodes
episode_dir: null                            # or a raw episode dir name under raw_root / an absolute path (wins)
stage3:                                      # Stage 3 closed loop (eval.stage3.DEFAULTS are the code defaults)
  n_episodes_per_pose: 3
  poses: {center: home, offsets_m: [[0.0, 0.0], [0.03, 0.0], [-0.03, 0.02]], yaw_deg: [0.0, 15.0, -15.0]}   # center: home | stage1 (--stage1 DIR)
  reset_timeout_s: 3.0
  home_timeout_s: 15.0
  settle_s: 0.5
  start_retries_n: 3
  finger_geom_patterns: [pad_, tag_, finger]
  ignore_contact_pairs: [[eraser, table]]
  table_geom_patterns: [table]                 # finger<->table contacts: reported as pad_table (A6 review finding 5), not collisions
provenance:
  "": {status: decision, source: "design_track_b.md finding 2"}
critical: []
