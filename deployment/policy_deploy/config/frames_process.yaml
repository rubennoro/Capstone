# frames: every setting, with its default (policy_deploy/STRUCTURE.md 4.4). station.yaml's `frames:` section may
# override any key here, and nothing else. Durations in seconds unless the name says _ms or _ns. Relative paths: from
# deployment/policy_deploy/. The Pi's address and every port are in station.yaml; nothing here may name a key of
# deployment/contracts/*.yaml.
rig_file: rigs/rig_pi_v2_640.yaml        # the rig as the Pi streams it: both cameras 640x480 @ 30 (rig_pi_v2 scaled)
mock_episode: ~/Downloads/episode_000045 # the recorded Pi episode the fake Pi plays (--mock only)
default_exposure_ns: 5000000             # used when exposure_us is 0, capped at half the rig frame period

receive:
  timeout_s: 0.1                         # wait for one C0 packet before checking the stop flag
  recv_hwm: 60                           # C0 packets ZeroMQ may queue (2 s); beyond that it drops whole packets

buffer:
  keep_s: 1.0                            # packets kept, and decoded ultrawide frames kept for finding a pair

select:
  main_spacing_ms: 50.0                  # 2 main frames, 20 Hz
  ultrawide_spacing_ms: 100.0            # 2 ultrawide frames, 10 Hz
  tolerance_frames: 2.0                  # a picked packet must be within this many frame periods of its target
  pair_max_age_ms: 60.0                  # the pair at most this much older than its main frame (mid-exposures)
  pair_max_lead_ms: 25.0                 # the pair at most this much newer; set from pi_collect's pair-gap report
  pair_max_reuse: 2                      # the same ultrawide frame may pair at most this many consecutive packets

health:
  stale_s: 0.35                          # age above which a camera is stale
  down_s: 2.0                            # age above which a camera is down
  fps_window_s: 1.0                      # window for the measured fps

clock:                                   # Pi -> laptop, one-way from t_send_ns (OneWayClockMap)
  window_s: 60.0                         # samples older than this are forgotten
  best_fraction: 0.3                     # least-delayed share of each 1 s slice used for offset and drift
  drift_min_span_s: 10.0                 # the best samples must span this long before drift is fitted
  max_drift_ppm: 500.0                   # a fitted drift above this is noise (set to 0)
  max_sync_age_s: 10.0                   # no packet for this long -> frames are not buffered

server:
  poll_s: 0.05                           # main loop period: C1 poll, ready check
  join_timeout_s: 2.0                    # wait per thread at shutdown

log:
  stats_every_s: 10.0                    # how often the stats line (and stats.jsonl) is written

mock:
  max_seconds: 10.0                      # how much of mock_episode is loaded and looped
  jpeg_quality: 90                       # fake JPEG quality
  pi_clock_offset_s: 1000.0              # fake Pi clock = laptop clock + this ...
  drift_ppm: 20.0                        # ... running this much fast
  send_hwm: 30                           # fake Pi PUB queue, in packets (the Pi's SNDHWM)

check:
  reachable_timeout_s: 1.0               # policy_deploy check: the TCP connect to the Pi
  subprocess_timeout_s: 10.0             # policy_deploy check: the rig-file and import subprocesses

probe:
  timeout_s: 2.0                         # python -m policy_deploy.frames.probe: wait for each reply
