# policy: every setting, with its default (policy_deploy/STRUCTURE.md 5.3). Override any key in station.yaml's
# `policy:` section; an unknown key there is an error. The C4 port is station.yaml ports.policy.

# --- meant to be set in station.yaml ---
kind: null                      # hold_still | diffusion; required unless --mock (PLAN 1: hold_still until a rig-trained
                                # checkpoint exists)
checkpoint: null                # the .ckpt file (opened read-only); required for kind diffusion
device: cuda                    # cuda | cpu (PLAN 13 device backup)
diffusion_steps: null           # int >= 1, or null = the checkpoint's own number (PLAN 13: third backup)
precision: fp32                 # fp32 | bf16 (autocast around predict_action, weights stay fp32; PLAN 13 second backup)
prompt_dataset: null            # a prompting checkpoint only (refused for a plain one): the processed .zarr.zip of
                                # the demos (opened read-only); the manager's task_name / prompt_index pick the demo
prompt_split: train             # train | val | all: the demos the model trained on, the ones it held out, or every demo
                                # (all: a dataset the model never trained on)
mock_kind: hold_still           # the kind that runs under --mock; diffusion times the real model against the fake Pi
                                # and fake PC (needs checkpoint and python.torch)

# --- start-up and serving ---
warmup_inferences: 2            # warm-up calls before ready (1st pays CUDA set-up, 2nd is representative)
warmup_gripper_width_m: 0.05    # gripper width in the warm-up (and probe) observation, m
reset_max_s: 0.5                # a slower reset is logged as a warning (PLAN 4 limit)
poll_s: 0.05                    # serve-loop poll; how quickly SIGINT/SIGTERM is noticed between requests
self_check_timeout_s: 20.0      # launcher: time allowed for `python -m policy_deploy.policy.self_check`

# --- what the checkpoint must match ---
training_timing:
  obs_down_sample_steps: 3      # 60 Hz data -> 50 ms steps (C1/C4)
  ultrawide_down_sample_steps: 1  # 10 Hz ultrawide -> 100 ms steps

# --- C4 field names -> the model's own names ---
key_map:
  obs:
    eef_pos: gripper_right_eef_pos
    eef_rot6d: gripper_right_eef_rot_axis_angle                     # rot6d despite the name
    eef_rot6d_wrt_start: gripper_right_eef_rot_axis_angle_wrt_start
    gripper_width_m: gripper_right_gripper_width
    main: camera_right_main_rgb
    ultrawide: camera_right_ultrawide_rgb
  action:
    eef_pos: right_pos
    eef_rot6d: right_rot
    gripper_width_m: right_gripper_width
