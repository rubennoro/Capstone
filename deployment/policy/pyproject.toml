[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "policy"
version = "1.0.0"
description = "Deployment policy process: serves the trained policy (or the hold-still stand-in) over C4"
requires-python = ">=3.10,<3.11"
dependencies = [
    "contracts",            # the local package deployment/contracts (pip install -e contracts first)
    "numpy>=1.26,<2.3",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# DiffusionPolicy only. Versions come from behavior_prompting/environment.yml (torch 2.7.1, dill 0.3.7,
# hydra-core 1.2.0, timm 1.0.20, diffusers 0.35.1); behavior_prompting itself is not on PyPI.
model = ["torch", "dill", "hydra-core", "timm", "diffusers"]
test = ["pytest==8.3.5"]

[tool.setuptools]
packages = ["policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"
