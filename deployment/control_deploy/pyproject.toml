# control_deploy: the PC's wrapper around franka_control (control_deploy/STRUCTURE.md sections 6, 8.1).
# deploy-contracts is NOT a dependency here: it is installed editable from deployment/contracts in the same command
# (deployment/STRUCTURE.md section 1.4); `control_deploy check` fails (row `env`) without it.
#   uv pip install --python ~/envs/control_deploy -e deployment/contracts[test] -e deployment/control_deploy[test]
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "control-deploy"
version = "1.0.0"
description = "The PC side of the deployment: checks, runs and drives franka_control (check | run | console | firewall)"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.26,<2.3",
    "msgpack==1.1.0",
    "pyzmq==27.1.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
control_deploy = "control_deploy.cli:main"

[tool.setuptools]
packages = ["control_deploy", "control_deploy.console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"
markers = ["needs_binary: runs franka_control/build/franka_control (skipped when it is not built)"]
