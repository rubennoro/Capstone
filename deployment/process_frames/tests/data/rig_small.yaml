# Test rig (not copied): a Pi rig's cameras at tiny resolutions, for fast pipeline tests.
# main 160x90 and ultrawide 128x96 (rig_pi_v1's nominal intrinsics x 0.1), virtual ultrawide 160x120 (x 0.25).
schema: dataproc.rig.v1
rig_id: rig_small
cameras:
  main:
    sensor: imx519
    resolution: [160, 90]
    fps: 30
    model:
      type: pinhole-radtan
      intrinsics: [123.125, 123.125, 79.5, 44.5]
      distortion: [-0.02, 0.01, 0.0, 0.0]
    T_imu_cam:
      rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}
      translation_m: [0.020, 0.0, 0.010]
    timestamp_ref: end_of_exposure
    time_offset_ns: 0
    provenance: nominal
  ultrawide:
    sensor: imx219
    resolution: [128, 96]
    fps: 30
    model:
      type: fisheye-equidistant
      intrinsics: [57.29, 57.29, 63.5, 47.5]
      distortion: [0.02, -0.005, 0.001, 0.0]
    T_imu_cam:
      rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}
      translation_m: [-0.020, 0.0, 0.010]
    timestamp_ref: end_of_exposure
    time_offset_ns: 0
    provenance: nominal
virtual_ultrawide:
  resolution: [160, 120]
  intrinsics: [61.66, 61.66, 79.666, 59.509]
  rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}
tcp:
  T_cam_tcp:
    rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}
    translation_m: [0.0, 0.0, 0.15]
  provenance: nominal
imu:
  sensor: lsm6dsox
  noise:
    gyroscope_noise_density: 6.6e-5
    gyroscope_random_walk: 2.0e-6
    accelerometer_noise_density: 7.0e-4
    accelerometer_random_walk: 1.0e-4
  time_offset_ns: 0
  provenance: nominal
aruco:
  dict: DICT_4X4_50
  marker_size_m: 0.016
  left_id: 0
  right_id: 1
  nominal_z_m: 0.098
