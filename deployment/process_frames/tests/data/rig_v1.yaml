# from rnoro/data-work:data-processing/configs/rigs/rig_v1.yaml @ 5330902
# changes: none
# dataproc rig description (schema dataproc.rig.v1). Copy to $DATAPROC_ROOT/rigs/rig_v1.yaml on the Jetson.
# Conventions: T_a_b maps points in frame b to frame a (pose of b in a), metres; camera frames are OpenCV optical
# (x right, y down, z forward); the training world is gravity-aligned z-up.
# Time: raw t_ns is the libcamera SensorTimestamp verbatim; timestamp_ref says what it marks.
#   mid-exposure camera time  t_cam = t_ns + s * (exposure_ns // 2) + time_offset_ns
#                             s = +1 for start_of_exposure, -1 for end_of_exposure
#   IMU time                  t_imu = t_ns + imu.time_offset_ns
# Kalibr: time_offset_ns = round(timeshift_cam_imu_s * 1e9), with Kalibr run on these mid-exposure stamps; a
# constant rolling-shutter half-readout is absorbed in time_offset_ns.
# Sections with provenance: nominal are datasheet / CAD guesses; replace them with calibrated values (and set
# provenance: calibrated).
schema: dataproc.rig.v1
rig_id: rig_v1
notes: >
  Rig v1 on the Panda: IMX519 main (pinhole, 1280x720 @ 60), IMX219 160 deg fisheye ultrawide (820x616 @ 30,
  2x2-binned 1640x1232 scaled by 1/2), LSM6DSOX IMU. All values nominal until calibration.
cameras:
  main:
    sensor: imx519
    resolution: [1280, 720]
    fps: 60
    model:
      type: pinhole-radtan
      intrinsics: [985.0, 985.0, 639.5, 359.5]       # fx fy cx cy: ~66 deg HFOV (2 * atan(640 / 985))
      distortion: [-0.02, 0.01, 0.0, 0.0]             # k1 k2 p1 p2: nominal low-distortion lens
    T_imu_cam:                                        # nominal: IMU 20 mm left of the main camera, axes parallel
      rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}
      translation_m: [0.020, 0.0, 0.010]
    timestamp_ref: end_of_exposure                    # nominal: verify against the Pi's libcamera
    time_offset_ns: 0
    provenance: nominal
  ultrawide:
    sensor: imx219
    resolution: [820, 616]
    fps: 30
    model:
      type: fisheye-equidistant
      intrinsics: [367.0, 367.0, 409.5, 307.5]       # f = 512.8 px half-diagonal / 80 deg (ideal 160 deg diagonal)
      distortion: [0.02, -0.005, 0.001, 0.0]          # Kannala-Brandt k1..k4: with these, ~156 deg diagonal FOV
    T_imu_cam:                                        # nominal: ultrawide 20 mm left of the IMU, axes parallel
      rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}
      translation_m: [-0.020, 0.0, 0.010]
    timestamp_ref: end_of_exposure                    # nominal: verify against the Pi's libcamera
    time_offset_ns: 0
    provenance: nominal

virtual_ultrawide:                                    # the iPhone 16 Pro ultrawide K at 640x480 (iPhUMI exports)
  resolution: [640, 480]
  intrinsics: [246.64919, 246.64919, 320.16495, 239.53679]
  rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}          # R_phys_virt (d_phys = R @ d_virt); optional, default identity

tcp:                                                  # T_cam_tcp is in the PHYSICAL ultrawide optical frame
  T_cam_tcp:                                          # nominal CAD: TCP 200 mm ahead and 60 mm below the camera;
    rotation: {euler_xyz_deg: [15.0, 0.0, 0.0]}       # TCP axes = camera axes rotated 15 deg about x (as iPhUMI's mount)
    translation_m: [0.0, 0.060, 0.200]
  provenance: nominal

imu:
  sensor: lsm6dsox
  noise:                                              # datasheet order of magnitude; replace with Allan variance
    gyroscope_noise_density: 6.6e-5                   # 3.8 mdps/sqrt(Hz)
    gyroscope_random_walk: 2.0e-6
    accelerometer_noise_density: 7.0e-4               # ~70 ug/sqrt(Hz)
    accelerometer_random_walk: 1.0e-4
  vio_inflation: {noise_density: 1.0, random_walk: 1.0}   # optional: VIO uses noise x these factors
  time_offset_ns: 0                                   # all streams share the Pi clock
  provenance: nominal

aruco:                                                # finger tags (iPhUMI aruco_config.yaml / gripper calibration)
  dict: DICT_4X4_50
  marker_size_m: 0.016
  left_id: 0
  right_id: 1
  nominal_z_m: 0.098                                  # tag depth along the virtual ultrawide z (outlier filter only)

gripper:                                              # checked by the calibration fit (dataproc calibrate)
  max_opening_m: 0.060                                # max_width - min_width (tag-to-tag x, metres). The simulator
  opening_tolerance_m: 0.010                          # sweeps 0.030-0.090 m (sim/trajectory.py CALIB_WIDTH_RANGE_M);
                                                      # fitted on sim calibration episodes: 0.0601-0.0605 m

world_offset:                                         # optional; applied on the left in the z-up world (pose stage
  translation_m: [0.1, 0.2, 0.3]                      # input). Yaw about +z must be >= 1 deg from a multiple of 360 so no pose has
  yaw_deg: 30.0                                       # rotation vector 0.
