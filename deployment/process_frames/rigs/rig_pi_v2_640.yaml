# rig_pi_v2 with both cameras streamed at 640x480 @ 30 for deployment (same sensor modes, scaled, not cropped:
# the same field of view). Intrinsics scaled from rig_pi_v2 (c' = (c + 0.5) * s - 0.5); everything else is rig_pi_v2.
# Keep in sync with rig_pi_v2.yaml (tcp block: `python -m deploy.geometry` with this as process_frames.rig_file).
# dataproc rig description (schema dataproc.rig.v1) for the Raspberry Pi 5 rig with the main camera in its full-view
# mode (from 2026-11-11, e.g. /data/incoming/episode_000044). `dataproc calibrate --rig rig_pi_v2` copies it to
# $DATAPROC_ROOT/rigs/rig_pi_v2.yaml if missing.
# Conventions and time model: as in rig_v1.yaml (T_a_b maps frame b to frame a, metres, OpenCV optical camera
# frames, gravity-aligned z-up world; t_cam = t_ns + s * (exposure_ns // 2) + time_offset_ns).
# Differences from rig_pi_v1: only the main camera. rig_pi_v1 is the old zoomed-in main stream (1600x900 @ 60,
# cropped from the 1920x1080 mode); here the main camera records 1600x1200 @ 30 from the full-sensor 2x2-binned
# 2328x1748 mode. The ultrawide, IMU, tags, gripper and TCP are unchanged. Everything is nominal until calibrated.
schema: dataproc.rig.v1
rig_id: rig_pi_v2_640
notes: >
  Pi 5 rig: IMX519 main (pinhole, 1600x1200 @ 30 from the full-sensor 2328x1748 mode), IMX219 160 deg fisheye
  ultrawide (1280x960 @ 30 from the 2x2-binned 1640x1232 mode), LSM6DSOX IMU at 104 Hz. All values nominal until
  calibration.
cameras:
  main:
    sensor: imx519
    resolution: [640, 480]
    fps: 30
    model:
      type: pinhole-radtan
      intrinsics: [492.5, 492.5, 319.5, 239.5]        # rig_pi_v2 x 0.4 (1600x1200 -> 640x480); nominal ~66 deg HFOV (~78 deg diagonal), centred; not used
      distortion: [-0.02, 0.01, 0.0, 0.0]             # by any processing stage (main images are only letterboxed)
    T_imu_cam:                                        # nominal, as rig_v1
      rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}
      translation_m: [0.020, 0.0, 0.010]
    timestamp_ref: end_of_exposure                    # Pi 5 SensorTimestamp = start-of-frame interrupt = end of the
    time_offset_ns: 0                                 # first row's exposure (sensor_rig/docs/raspberry_pi.md §5)
    provenance: nominal
  ultrawide:
    sensor: imx219
    resolution: [640, 480]
    fps: 30
    model:
      type: fisheye-equidistant
      intrinsics: [286.45, 286.45, 319.5, 239.5]      # rig_pi_v2 x 0.5 (1280x960 -> 640x480)
      distortion: [0.02, -0.005, 0.001, 0.0]          # Kannala-Brandt k1..k4 (scale-free), as rig_v1
    T_imu_cam:                                        # nominal, as rig_v1
      rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}
      translation_m: [-0.020, 0.0, 0.010]
    timestamp_ref: end_of_exposure                    # see main
    time_offset_ns: 0
    provenance: nominal
virtual_ultrawide:                                    # the iPhone 16 Pro ultrawide K at 640x480 (iPhUMI exports)
  resolution: [640, 480]
  intrinsics: [246.64919, 246.64919, 320.16495, 239.53679]
  rotation: {euler_xyz_deg: [0.0, 0.0, 0.0]}
# T_cam_tcp COMPUTED by `python -m deploy.geometry` on 2026-11-12 from /home/ruben/Capstone-deployment/deployment/gripper.yaml
# and franka_control tcp.F_T_TCP. Do not edit by hand: change gripper.yaml and rerun the tool.
tcp:
  T_cam_tcp:
    matrix: [[0.000000000, 1.000000000, 0.000000000, 0.000000000], [-0.965925826, 0.000000000, -0.258819045, 0.016891254], [-0.258819045, 0.000000000, 0.965925826, 0.149464663], [0.000000000, 0.000000000, 0.000000000, 1.000000000]]   # 4x4, row-major
  provenance: nominal
imu:
  sensor: lsm6dsox
  noise:                                              # datasheet order of magnitude; replace with Allan variance
    gyroscope_noise_density: 6.6e-5
    gyroscope_random_walk: 2.0e-6
    accelerometer_noise_density: 7.0e-4
    accelerometer_random_walk: 1.0e-4
  vio_inflation: {noise_density: 1.0, random_walk: 1.0}
  time_offset_ns: 0                                   # all streams share the Pi clock
  provenance: nominal
aruco:                                                # finger tags (iPhUMI aruco_config.yaml / gripper calibration)
  dict: DICT_4X4_50
  marker_size_m: 0.016
  left_id: 0
  right_id: 1
  nominal_z_m: 0.098
gripper:                                              # checked by `dataproc calibrate` (docs/PROCESS.md)
  max_opening_m: 0.080                                # max_width - min_width of the fit (tag-to-tag x, metres). 0.080, not
                                                      # 0.110: limited to the Franka Hand's 80 mm stroke (2026-11-12), so
                                                      # every demonstrated width is one the robot can reproduce.
  opening_tolerance_m: 0.010
world_offset:                                         # as rig_v1 (see docs/GEOMETRY.md)
  translation_m: [0.1, 0.2, 0.3]
  yaw_deg: 30.0
