# process_frames defaults (STRUCTURE.md section 10). station.yaml's process_frames: section may override any key here,
# and nothing else. Durations in seconds unless the name says _ms or _ns. Relative paths: from this folder.
rig_file: rigs/rig_pi_v1_standin.yaml    # deploy check warns while it is the stand-in
decoder: h264                            # h264 | jpeg (PLAN §9 backup); also what FakePiSender sends under --mock
mock_episode: null                       # a recorded Pi episode folder, played back by FakePiSender; --mock only
default_exposure_ns: 5000000             # used when C0's exposure_ns is 0, capped at half the rig frame period

receive:
  timeout_s: 0.1                         # wait for one C0 message before checking the stop flag
  recv_hwm: 120                          # C0 messages ZeroMQ may queue (2 s of both cameras)

buffer:
  keep_s: 1.0                            # frames kept per camera

select:
  main_spacing_ms: 50.0                  # 2 main frames, 20 Hz
  ultrawide_spacing_ms: 100.0            # 2 ultrawide frames, 10 Hz
  tolerance_ms: 25.0                     # a picked frame must be this close to its target

health:
  stale_s: 0.35                          # age above which a camera is stale
  down_s: 2.0                            # age above which a camera is down
  fps_window_s: 1.0                      # window for the measured fps

clock:
  interval_s: 1.0                        # one time_sync exchange this often
  timeout_s: 0.5                         # wait for one time_sync reply
  startup_exchanges: 10                  # back to back at start-up
  window_s: 60.0                         # samples older than this are forgotten
  best_fraction: 0.3                     # shortest-round-trip share of the window used for offset and drift
  drift_min_span_s: 10.0                 # the best samples must span this long before drift is fitted
  max_drift_ppm: 500.0                   # a fitted drift above this is noise (set to 0)
  max_sync_age_s: 10.0                   # no good sample for this long -> frames are not buffered

h264:
  thread_type: SLICE                     # SLICE | NONE (never FRAME: it delays every picture)

server:
  poll_s: 0.05                           # main loop period: C1 poll, ready check
  join_timeout_s: 2.0                    # wait per thread at shutdown

log:
  stats_every_s: 10.0                    # how often the stats line is written

mock:
  max_seconds: 10.0                      # how much of mock_episode is loaded and looped
  keyframe_interval: 30                  # fake H.264: a keyframe every this many frames
  bitrate: 10000000                      # fake H.264 bit rate
  jpeg_quality: 90                       # fake JPEG quality
  pi_clock_offset_s: 1000.0              # fake Pi clock = PC clock + this ...
  drift_ppm: 20.0                        # ... running this much fast
  send_hwm: 120                          # fake Pi PUB queue

check:
  reachable_timeout_s: 1.0               # deploy check: the TCP connect to the Pi
  subprocess_timeout_s: 10.0             # deploy check: the rig-file and import subprocesses

probe:
  timeout_s: 2.0                         # python -m process_frames.probe: wait for each reply
