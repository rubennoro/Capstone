[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "contracts"
version = "1.0.0"
description = "Deployment message contracts C0-C4: messages, validators, wire format, examples, ZeroMQ helpers"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.26,<2.3",
    "msgpack==1.1.0",
    "pyzmq==27.1.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools]
packages = ["contracts"]

[tool.setuptools.package-data]
contracts = ["limits.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"
