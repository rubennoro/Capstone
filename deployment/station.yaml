# Every setting `deploy check` and `deploy run` need (schema: deploy/STRUCTURE.md §6). One file for real and --mock runs.
# Lines marked TODO need your values. Ports are written only here.
station_version: 1
session_root: ~/deploy_sessions                    # where each run's logs and episode records go

python:
  light: ~/envs/deploy/bin/python                  # TODO: your path (the light environment, INSTRUCTIONS.md)
  policy: ~/miniconda3/envs/behavior_prompting/bin/python   # TODO: your path (the behavior_prompting conda env with torch)

endpoints:
  pi_frames: tcp://192.168.1.50:5600               # TODO: the Pi's address on the Wi-Fi (C0 frames; the Pi binds)
  pi_time_sync: tcp://192.168.1.50:5601            # TODO: same Pi address (C0 clock sync)
  mock_pi_frames: tcp://127.0.0.1:5600             # --mock: the fake Pi inside process_frames
  mock_pi_time_sync: tcp://127.0.0.1:5601
  frames: tcp://127.0.0.1:5610                     # C1: process_frames <-> message_comms
  state: tcp://127.0.0.1:5620                      # C2: franka_control -> message_comms
  commands: tcp://127.0.0.1:5630                   # C3: message_comms -> franka_control
  policy: tcp://127.0.0.1:5640                     # C4: message_comms <-> policy

franka_control:
  realtime: ignore                                 # TODO: set to enforce once the PC has a PREEMPT_RT kernel (PLAN §9)

process_frames:
  mock_episode: ~/rig_episodes/ep_0003             # TODO: a recorded Pi episode, used only by --mock

policy:
  kind: hold_still                                 # hold_still until a rig-trained diffusion checkpoint exists (PLAN §6.2)
